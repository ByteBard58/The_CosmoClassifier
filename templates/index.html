<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The CosmoClassifier 🌌</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">
    <header>
        <h1>The CosmoClassifier 🪐</h1>
        <p class="subtitle">Predict Celestial Objects using SDSS Spectroscopic Data</p>
    </header>

    <form id="predictForm">
        <div class="input-grid">
            {% for col, label in zip(columns, labels) %}
                {% if col != 'class' %}
                <div class="input-group">
                    <input type="number" id="{{ col }}" name="{{ col }}" placeholder=" " step="any" required>
                    <label for="{{ col }}">{{ label }}</label>
                </div>
                {% endif %}
            {% endfor %}
        </div>
        <button type="submit" id="predictBtn">
            <span>Analyze Data</span>
        </button>
    </form>

    <div id="result" class="hidden">
        <div id="predClass"></div>
        <div id="probabilities"></div>
    </div>

    <footer>
        <p>
            Powered by Scikit-Learn • 
            <a href="https://github.com/ByteBard58/The_CosmoClassifier" target="_blank">View on GitHub</a>
        </p>
        <p>&copy; 2025 ByteBard58. MIT License.</p>
    </footer>
</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
